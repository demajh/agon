# Agon self-host / development stack.
#   docker compose up -d                      everything: Postgres, MinIO, the Agon server, the demo app
#   docker compose up -d postgres             just the database (local development, tests)
#
# The server listens on http://localhost:4000 (docs at /docs). Inside the compose network the demo
# variants are http://demo-control:3000 and http://demo-treatment:3000; from the host they are
# http://localhost:3001 and http://localhost:3002. An agon.yaml uploaded to the server should use
# the in-network URLs, since the worker's browser runs inside the server container.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agon
      POSTGRES_PASSWORD: agon
      POSTGRES_DB: agon
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agon -d agon']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    # Optional until an S3 sink exists: `docker compose --profile storage up -d`.
    profiles: ['storage']
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: agon
      MINIO_ROOT_PASSWORD: agonagon
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # API + worker in one process (AGON_ROLE=all). Build context is the repo root.
  server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    environment:
      DATABASE_URL: postgres://agon:agon@postgres:5432/agon
      AGON_API_KEYS: dev-operator-key:operator
      AGON_DATA_DIR: /data
      AGON_ROLE: all
      AGON_LOG_LEVEL: info
      # AGON_LLM_MODE: live | record | replay | off; set ANTHROPIC_API_KEY / OPENAI_API_KEY for live runs.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - '4000:4000'
    volumes:
      - agondata:/data
    depends_on:
      postgres:
        condition: service_healthy

  # Ledgerly, the demo target: one container per variant. Analytics go to a dead host and are
  # intercepted by Agon's browser anyway.
  demo-control:
    build:
      context: .
      dockerfile: examples/demo-app/Dockerfile
    environment:
      VARIANT: control
      PORT: '3000'
      POSTHOG_HOST: http://localhost:9999
    ports:
      - '3001:3000'

  demo-treatment:
    build:
      context: .
      dockerfile: examples/demo-app/Dockerfile
    environment:
      VARIANT: treatment
      PORT: '3000'
      POSTHOG_HOST: http://localhost:9999
    ports:
      - '3002:3000'

volumes:
  pgdata:
  minio:
  agondata:
