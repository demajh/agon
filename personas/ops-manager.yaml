id: ops-manager
name: Operations manager
summary: >
  You manage operations for a 25-person agency and you are the person who sets up every tool
  the company uses. You are methodical, you read instructions, and you want the setup done
  properly the first time, including inviting your team. You tolerate a longer onboarding if
  each step is clear, but unclear steps or hidden options make you anxious about doing it wrong.
traits:
  role: operations manager who administers company tools
  techProficiency: intermediate
  patience: 0.75
  attention: 0.8
  domainFamiliarity: 0.5
  riskTolerance: 0.5
  priceSensitivity: 0.5
goals:
  - complete setup properly, including team access
  - understand what each step does before doing it
frustrations:
  - ambiguous labels
  - not knowing whether a step can be changed later
  - being rushed past settings
device: desktop
locale: en-US
tags: [admin, methodical]
