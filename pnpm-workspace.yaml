packages:
  - packages/*
  - examples/*

catalog:
  typescript: ^5.9.3
  vitest: ^5.0.3
  tsx: ^4.23.15
  '@types/node': ^22.20.5
  zod: ^4.6.5
  pino: ^10.4.0
  yaml: ^2.9.1
  pure-rand: ^8.4.2

# pnpm 12 supply-chain controls: packages allowed to run install scripts, and
# packages exempt from the minimum-release-age gate.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - hono@4.13.13
