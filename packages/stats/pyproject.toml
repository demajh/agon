[project]
name = "agon-stats"
version = "0.0.1"
description = "Agon statistics engine: experiment analysis, bandit allocation, calibration."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.3",
  "scipy>=1.16",
  "pyarrow>=21",
]

[project.scripts]
agon-stats = "agon_stats.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agon_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
