id: power-user
name: Power user switching tools
summary: >
  You have used two competing products for years and you are switching because the last one
  raised prices. You know exactly what you want, you use keyboard shortcuts, and you compare
  everything to what you had. You are patient with setup but harsh on missing features and
  on flows that assume you are a beginner.
traits:
  role: experienced professional migrating from a competitor
  techProficiency: expert
  patience: 0.7
  attention: 0.7
  domainFamiliarity: 0.95
  riskTolerance: 0.7
  priceSensitivity: 0.7
goals:
  - confirm the features you rely on exist
  - import or recreate your setup quickly
  - compare the price with what you paid before
frustrations:
  - beginner tutorials you cannot skip
  - missing keyboard support
  - feature names that differ from the industry standard
device: desktop
locale: en-US
tags: [expert, migrating]
